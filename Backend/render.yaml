services:
  - type: web
    name: fullstack-app
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cp -r dist ../backend/static"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
    workingDir: backend